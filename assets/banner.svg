<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="55%" stop-color="#10152B"/>
      <stop offset="100%" stop-color="#17112B"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#B9A7FF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#B9A7FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- soft cosmic glow -->
  <circle cx="970" cy="100" r="180" fill="url(#glow)"/>
  <circle cx="170" cy="240" r="130" fill="url(#glow)" opacity=".35"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="55" r="2"/>
    <circle cx="140" cy="110" r="1.5"/>
    <circle cx="245" cy="45" r="2"/>
    <circle cx="350" cy="90" r="1.5"/>
    <circle cx="470" cy="35" r="2"/>
    <circle cx="590" cy="75" r="1.5"/>
    <circle cx="720" cy="40" r="2"/>
    <circle cx="820" cy="125" r="1.5"/>
    <circle cx="1040" cy="45" r="2"/>
    <circle cx="1130" cy="180" r="1.5"/>
    <circle cx="930" cy="235" r="2"/>
    <circle cx="110" cy="225" r="1.5"/>
  </g>

  <!-- constellation -->
  <g stroke="#B9A7FF" stroke-width="1" opacity=".45">
    <line x1="870" y1="70" x2="940" y2="125"/>
    <line x1="940" y1="125" x2="1010" y2="80"/>
    <line x1="1010" y1="80" x2="1080" y2="140"/>
  </g>

  <g fill="#B9A7FF">
    <circle cx="870" cy="70" r="4"/>
    <circle cx="940" cy="125" r="5"/>
    <circle cx="1010" cy="80" r="4"/>
    <circle cx="1080" cy="140" r="3"/>
  </g>

  <!-- text -->
  <text x="80" y="125"
        fill="#F4F1FF"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="700">
    ✦ Hi, I'm Shashi Agrawal
  </text>

  <text x="82" y="165"
        fill="#B9A7FF"
        font-family="Arial, sans-serif"
        font-size="20"
        letter-spacing="3">
    AI • ML • DEEP LEARNING • GENAI
  </text>

  <text x="82" y="205"
        fill="#C8C8D8"
        font-family="Arial, sans-serif"
        font-size="17">
    Exploring the space between data and intelligence.
  </text>

  <!-- meteor -->
  <line x1="1030" y1="215" x2="1100" y2="250"
        stroke="#FFFFFF" stroke-width="2" opacity=".7"/>
  <circle cx="1030" cy="215" r="4" fill="#FFFFFF"/>

</svg>
